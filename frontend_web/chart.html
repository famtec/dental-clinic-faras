    <script src="api-config.js"></script>
    <script>
        const doctorName = localStorage.getItem('doctor_name');
        const titleElement = document.querySelector('h1');
        const mobileMenuToggle = document.getElementById('mobileMenuToggle');
        const sidebarNav = document.getElementById('sidebarNav');

        function syncSidebarNav() {
            if (!sidebarNav) return;
            if (window.innerWidth >= 1024) {
                sidebarNav.classList.remove('hidden');
                sidebarNav.classList.add('flex');
            } else {
                sidebarNav.classList.add('hidden');
                sidebarNav.classList.remove('flex');
            }
        }

        if (mobileMenuToggle && sidebarNav) {
            mobileMenuToggle.addEventListener('click', () => {
                sidebarNav.classList.toggle('hidden');
            });
        }

        window.addEventListener('resize', syncSidebarNav);
        syncSidebarNav();

        if (titleElement) {
            titleElement.textContent = doctorName ? `عيادة ${doctorName}` : 'عيادتي الرقمية';
        }

        let selectedTooth = null;
        const PATIENTS_API_URL = apiUrl('/api/patients');
        const TREATMENTS_API_URL = apiUrl('/api/treatments');

        async function ensurePatientId() {
            const patientInput = document.getElementById('patientId');
            const currentValue = patientInput.value.trim();
            if (currentValue) {
                const parsed = parseInt(currentValue, 10);
                if (!Number.isNaN(parsed)) {
                    return parsed;
                }
            }

            try {
                const patientsResponse = await fetch(PATIENTS_API_URL);
                if (!patientsResponse.ok) {
                    throw new Error('تعذر قراءة بيانات المرضى');
                }

                const patients = await patientsResponse.json();
                if (patients && patients.length > 0) {
                    patientInput.value = patients[0].id;
                    return patients[0].id;
                }

                const createResponse = await fetch(PATIENTS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: 'مريض افتراضي',
                        phone: '0000000000',
                        birth_date: '2000-01-01',
                        gender: 'Male',
                        medical_history: 'تم إنشاؤه تلقائيًا'
                    })
                });

                if (!createResponse.ok) {
                    throw new Error('تعذر إنشاء مريض افتراضي');
                }

                const createdPatient = await createResponse.json();
                patientInput.value = createdPatient.id;
                return createdPatient.id;
            } catch (error) {
                console.error(error);
                throw error;
            }
        }

        function openModal(number) {
            selectedTooth = number;
            document.getElementById('modalToothNumber').textContent = number;
            document.querySelectorAll('.tooth').forEach((el) => el.classList.remove('active'));
            const tooth = document.getElementById(`tooth-${number}`);
            if (tooth) tooth.classList.add('active');
            document.getElementById('treatmentModal').classList.remove('hidden');
            document.getElementById('treatmentModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('treatmentModal').classList.add('hidden');
            document.getElementById('treatmentModal').classList.remove('flex');
            document.getElementById('treatmentForm').reset();
            document.querySelectorAll('.tooth').forEach((el) => el.classList.remove('active'));
            selectedTooth = null;
        }

        document.getElementById('treatmentForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!selectedTooth) {
                alert('يرجى اختيار سن أولاً');
                return;
            }

            try {
                const patientId = await ensurePatientId();
                const payload = {
                    patient_id: patientId,
                    tooth_number: parseInt(selectedTooth, 10),
                    treatment_type: document.getElementById('treatmentType').value,
                    notes: document.getElementById('notes').value,
                    color: document.getElementById('statusColor').value
                };

                const response = await fetch(TREATMENTS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || 'فشل الحفظ');
                }

                const tooth = document.getElementById(`tooth-${selectedTooth}`);
                if (tooth) {
                    tooth.setAttribute('data-status', 'treated');
                    tooth.style.fill = payload.color;
                }

                alert('تم حفظ العلاج بنجاح');
                closeModal();
            } catch (error) {
                console.error(error);
                alert(`فشل الاتصال بالخادم: ${error.message}`);
            }
        });
    </script>
