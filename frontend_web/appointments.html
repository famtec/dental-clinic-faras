<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المواعيد اليومية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden bg-slate-50 text-slate-800">
    <div class="flex min-h-screen flex-col lg:flex-row">
        <aside class="w-full bg-indigo-900 p-4 text-white shadow-lg lg:min-h-screen lg:w-72 lg:p-6 xl:w-80">
            <div class="mb-4 flex items-center justify-center gap-3 border-b border-indigo-700 pb-4 lg:mb-8">
                <img src="logo.png" alt="شعار العيادة" class="h-14 w-14 rounded-xl object-contain bg-white/10 p-2 sm:h-16 sm:w-16" />
                <h1 class="text-lg font-bold sm:text-xl">عيادتي الرقمية</h1>
            </div>
            <button id="mobileMenuToggle" type="button" class="mb-3 flex w-full items-center justify-center rounded-lg border border-indigo-700/60 bg-indigo-800/70 px-3 py-2 text-sm font-semibold text-white lg:hidden">☰ القائمة</button>
            <nav id="sidebarNav" class="hidden flex-col gap-2 lg:flex lg:gap-3">
                <a href="index.html" class="block rounded-lg px-4 py-3 text-sm font-medium transition hover:bg-indigo-800">👥 لوحة مرضى</a>
                <a href="appointments.html" class="block rounded-lg bg-indigo-700 px-4 py-3 text-sm font-bold">📅 المواعيد اليومية</a>
                <a href="chart.html" class="block rounded-lg px-4 py-3 text-sm font-medium transition hover:bg-indigo-800">🦷 مخطط الأسنان</a>
            </nav>
        </aside>

        <main class="flex-1 p-4 sm:p-6 lg:p-8 xl:p-10">
            <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <div>
                    <h2 class="text-2xl font-extrabold text-slate-800 sm:text-3xl">جدول المواعيد اليومية</h2>
                    <p class="mt-1 text-sm text-slate-500">تابع جميع المواعيد واستقبل مواعيد جديدة بسهولة.</p>
                </div>
                <button id="openModalBtn" class="w-full rounded-xl bg-indigo-600 px-5 py-3 font-bold text-white shadow-lg transition hover:bg-indigo-700 sm:w-auto">
                    + إضافة موعد جديد
                </button>
            </div>

            <section class="rounded-3xl border border-slate-200 bg-white p-4 shadow-xl sm:p-6">
                <div class="mb-4 flex items-center justify-between">
                    <h3 class="text-xl font-bold text-indigo-900">المواعيد</h3>
                    <span class="rounded-full bg-indigo-50 px-3 py-1 text-sm font-medium text-indigo-700">محدث تلقائيًا</span>
                </div>

                <div class="overflow-x-auto">
                    <table class="min-w-full border-collapse text-right">
                        <thead>
                            <tr class="border-b border-slate-200 bg-slate-50 text-sm text-slate-600">
                                <th class="px-4 py-3 font-semibold">ID</th>
                                <th class="px-4 py-3 font-semibold">اسم المريض</th>
                                <th class="px-4 py-3 font-semibold">الوقت</th>
                                <th class="px-4 py-3 font-semibold">الإجراء</th>
                                <th class="px-4 py-3 font-semibold">الحالة</th>
                            </tr>
                        </thead>
                        <tbody id="appointmentsTableBody" class="divide-y divide-slate-100">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="appointmentModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 p-3 backdrop-blur-sm sm:p-4">
        <div class="w-full max-w-[95vw] rounded-3xl border border-slate-200 bg-white p-4 shadow-2xl sm:max-w-md sm:p-6">
            <div class="mb-5 flex items-start justify-between">
                <div>
                    <p class="text-sm font-semibold text-indigo-600">إضافة موعد جديد</p>
                    <h3 class="text-2xl font-bold text-slate-800">موعد طبي</h3>
                </div>
                <button id="closeModalBtn" type="button" class="rounded-full bg-slate-100 px-3 py-1 text-sm text-slate-600 transition hover:bg-slate-200">إغلاق</button>
            </div>

            <form id="appointmentForm" class="space-y-4">
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-600">اسم المريض</label>
                    <input id="patientName" type="text" required class="w-full rounded-xl border border-slate-300 px-3 py-2 outline-none focus:border-indigo-500" />
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-600">الوقت</label>
                    <input id="appointmentTime" type="time" required class="w-full rounded-xl border border-slate-300 px-3 py-2 outline-none focus:border-indigo-500" />
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-600">الإجراء</label>
                    <select id="procedureType" class="w-full rounded-xl border border-slate-300 px-3 py-2 outline-none focus:border-indigo-500">
                        <option value="فحص">فحص</option>
                        <option value="حشوة">حشوة</option>
                        <option value="سحب عصب">سحب عصب</option>
                        <option value="تقويم">تقويم</option>
                    </select>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-1 rounded-xl bg-indigo-600 px-4 py-3 font-bold text-white shadow-lg transition hover:bg-indigo-700">
                        حفظ الموعد
                    </button>
                    <button id="cancelModalBtn" type="button" class="rounded-xl border border-slate-300 px-4 py-3 font-semibold text-slate-600 transition hover:bg-slate-100">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const doctorName = localStorage.getItem('doctor_name');
        const titleElement = document.querySelector('h1');
        const mobileMenuToggle = document.getElementById('mobileMenuToggle');
        const sidebarNav = document.getElementById('sidebarNav');

        function syncSidebarNav() {
            if (!sidebarNav) return;
            if (window.innerWidth >= 1024) {
                sidebarNav.classList.remove('hidden');
                sidebarNav.classList.add('flex');
            } else {
                sidebarNav.classList.add('hidden');
                sidebarNav.classList.remove('flex');
            }
        }

        if (mobileMenuToggle && sidebarNav) {
            mobileMenuToggle.addEventListener('click', () => {
                sidebarNav.classList.toggle('hidden');
            });
        }

        window.addEventListener('resize', syncSidebarNav);
        syncSidebarNav();

        if (titleElement) {
            titleElement.textContent = doctorName ? `عيادة ${doctorName}` : 'عيادتي الرقمية';
        }

        const API_URL = '/api/appointments';
        const tableBody = document.getElementById('appointmentsTableBody');
        const modal = document.getElementById('appointmentModal');
        const form = document.getElementById('appointmentForm');

        function openModal() {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            form.reset();
        }

        function renderAppointments(appointments) {
            if (!appointments.length) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-4 py-8 text-center text-sm text-slate-500">لا توجد مواعيد مسجلة حاليًا.</td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = appointments.map((appointment) => {
                const status = appointment.status || 'Pending';
                const badgeClass = status === 'Completed'
                    ? 'bg-emerald-100 text-emerald-700'
                    : status === 'Cancelled'
                        ? 'bg-rose-100 text-rose-700'
                        : 'bg-amber-100 text-amber-700';

                return `
                    <tr class="block rounded-2xl border border-slate-200 bg-white p-2 shadow-sm transition hover:bg-slate-50 sm:table-row sm:rounded-none sm:border-0 sm:bg-transparent sm:p-0">
                        <td class="flex items-center justify-between gap-3 border-b border-slate-100 px-4 py-3 text-sm text-slate-600 last:border-b-0 sm:table-cell sm:border-b-0">
                            <span class="text-xs font-semibold text-slate-400 sm:hidden">ID</span>
                            <span>${appointment.id ?? '-'}</span>
                        </td>
                        <td class="flex items-center justify-between gap-3 border-b border-slate-100 px-4 py-3 text-sm font-semibold text-slate-700 last:border-b-0 sm:table-cell sm:border-b-0">
                            <span class="text-xs font-semibold text-slate-400 sm:hidden">اسم المريض</span>
                            <span>${appointment.patient_name || '—'}</span>
                        </td>
                        <td class="flex items-center justify-between gap-3 border-b border-slate-100 px-4 py-3 text-sm text-slate-600 last:border-b-0 sm:table-cell sm:border-b-0">
                            <span class="text-xs font-semibold text-slate-400 sm:hidden">الوقت</span>
                            <span>${appointment.appointment_time || '—'}</span>
                        </td>
                        <td class="flex items-center justify-between gap-3 border-b border-slate-100 px-4 py-3 text-sm text-slate-600 last:border-b-0 sm:table-cell sm:border-b-0">
                            <span class="text-xs font-semibold text-slate-400 sm:hidden">الإجراء</span>
                            <span>${appointment.procedure_type || '—'}</span>
                        </td>
                        <td class="flex items-center justify-between gap-3 border-b border-slate-100 px-4 py-3 text-sm last:border-b-0 sm:table-cell sm:border-b-0">
                            <span class="text-xs font-semibold text-slate-400 sm:hidden">الحالة</span>
                            <span class="rounded-full px-3 py-1 ${badgeClass}">${status}</span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function loadAppointments() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error('فشل في جلب المواعيد');
                }
                const data = await response.json();
                renderAppointments(data);
            } catch (error) {
                console.error(error);
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-4 py-8 text-center text-sm text-rose-600">تعذر الاتصال بالخادم.</td>
                    </tr>
                `;
            }
        }

        document.getElementById('openModalBtn').addEventListener('click', openModal);
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
        modal.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const payload = {
                patient_name: document.getElementById('patientName').value.trim(),
                appointment_time: document.getElementById('appointmentTime').value,
                procedure_type: document.getElementById('procedureType').value,
                status: 'Pending'
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || 'فشل حفظ الموعد');
                }

                closeModal();
                await loadAppointments();
                alert('تم حفظ الموعد بنجاح');
            } catch (error) {
                console.error(error);
                alert(`فشل حفظ الموعد: ${error.message}`);
            }
        });

        window.addEventListener('DOMContentLoaded', loadAppointments);
    </script>
</body>
</html>
