<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عيادتي الرقمية - تفعيل حساب جديد</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    @keyframes popIn {
      0% { transform: scale(0.96); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: popIn 0.35s ease-out; }
  </style>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top_left,_rgba(99,102,241,0.22),_transparent_30%),linear-gradient(135deg,_#f8fafc_0%,_#eef2ff_45%,_#e0e7ff_100%)] text-slate-800">
  <div class="flex min-h-screen items-center justify-center px-4 py-10 sm:px-6 lg:px-8">
    <div class="w-full max-w-lg">
      <div class="overflow-hidden rounded-[32px] border border-slate-200 bg-white shadow-2xl shadow-slate-200/80">
        <div class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-violet-700 px-6 py-8 text-center text-white sm:px-8">
          <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl border border-white/20 bg-white/10 text-4xl shadow-lg">
            🦷
          </div>
          <h1 class="text-2xl font-extrabold">عيادتي الرقمية - تفعيل حساب جديد</h1>
          <p class="mt-2 text-sm text-indigo-100">أنشئ حسابك الطبي وابدأ استخدام المنصة بأمان</p>
        </div>

        <div class="p-6 sm:p-8">
          <div id="messageBox" class="mb-4 hidden rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-medium text-rose-700 shadow-sm"></div>

          <form id="registerForm" class="space-y-4">
            <div>
              <label for="fullName" class="mb-2 block text-sm font-semibold text-slate-700">الاسم الكامل</label>
              <input
                id="fullName"
                name="fullName"
                type="text"
                required
                class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-right text-sm text-slate-700 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100"
                placeholder="مثال: د. أحمد العلي"
              />
            </div>

            <div>
              <label for="email" class="mb-2 block text-sm font-semibold text-slate-700">البريد الإلكتروني</label>
              <input
                id="email"
                name="email"
                type="email"
                required
                autocomplete="email"
                class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-right text-sm text-slate-700 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100"
                placeholder="doctor@clinic.com"
              />
            </div>

            <div>
              <label for="password" class="mb-2 block text-sm font-semibold text-slate-700">كلمة المرور</label>
              <input
                id="password"
                name="password"
                type="password"
                required
                autocomplete="new-password"
                class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-right text-sm text-slate-700 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100"
                placeholder="••••••••"
              />
            </div>

            <div>
              <label for="activationCode" class="mb-2 block text-sm font-semibold text-slate-700">كود التفعيل الرقمي (Activation Code)</label>
              <input
                id="activationCode"
                name="activationCode"
                type="text"
                required
                class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-right text-sm text-slate-700 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100"
                placeholder="FARAS-30DAYS-XYZ"
              />
            </div>

            <button
              id="submitBtn"
              type="submit"
              class="w-full rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-4 py-3 text-sm font-bold text-white shadow-lg transition hover:from-indigo-700 hover:to-violet-700 disabled:cursor-not-allowed disabled:opacity-70"
            >
              تفعيل الحساب
            </button>
          </form>

          <div class="mt-6 flex justify-center">
            <p class="text-center text-xs font-mono tracking-wide text-indigo-500/90">
              تطوير وإدارة: المهندس فارس حلاوي © 2026
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const registerForm = document.getElementById('registerForm');
    const messageBox = document.getElementById('messageBox');
    const submitBtn = document.getElementById('submitBtn');

    function showMessage(text, type = 'error') {
      const baseClasses = 'rounded-2xl border px-4 py-3 text-sm font-medium shadow-sm animate-pop';
      if (type === 'success') {
        messageBox.className = `${baseClasses} border-emerald-200 bg-emerald-50 text-emerald-700`;
      } else {
        messageBox.className = `${baseClasses} border-rose-200 bg-rose-50 text-rose-700`;
      }
      messageBox.innerHTML = text;
      messageBox.classList.remove('hidden');
    }

    function hideMessage() {
      messageBox.classList.add('hidden');
      messageBox.innerHTML = '';
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.textContent = isLoading ? 'جاري التفعيل...' : 'تفعيل الحساب';
    }

    registerForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideMessage();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const activationCode = document.getElementById('activationCode').value.trim();

      if (!fullName || !email || !password || !activationCode) {
        showMessage('يرجى تعبئة جميع الحقول قبل المتابعة.', 'error');
        return;
      }

      setLoading(true);

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            doctor_name: fullName,
            email,
            password,
            activation_code: activationCode
          })
        });

        if (response.ok) {
          showMessage('تم تفعيل الحساب بنجاح! سيتم تحويلك إلى صفحة تسجيل الدخول...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1400);
          return;
        }

        showMessage('كود التفعيل خاطئ أو تم استخدامه مسبقاً! يرجى التواصل مع المهندس فارس حلاوي لشراء كود جديد.', 'error');
      } catch (error) {
        showMessage('تعذر الاتصال بالخادم الآن. يرجى المحاولة لاحقًا.', 'error');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
