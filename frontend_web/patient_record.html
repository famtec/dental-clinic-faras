<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الملف الطبي الشامل للمريض</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Tajawal', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top_left,_rgba(99,102,241,0.22),_transparent_30%),linear-gradient(135deg,_#f8fafc_0%,_#eef2ff_45%,_#e0e7ff_100%)] text-slate-800">
  <div class="mx-auto flex min-h-screen max-w-7xl flex-col px-4 py-6 sm:px-6 lg:px-8">
    <header class="mb-6 rounded-[28px] border border-slate-200 bg-white/90 p-5 shadow-xl shadow-slate-200/80 backdrop-blur">
      <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div>
          <p id="clinicTitle" class="text-lg font-extrabold text-indigo-900">عيادتي الرقمية</p>
          <h1 class="mt-1 text-2xl font-extrabold text-slate-800">الملف الطبي الشامل للمريض</h1>
        </div>
        <div class="rounded-full border border-indigo-200 bg-indigo-50 px-4 py-2 text-sm font-semibold text-indigo-700">
          متابعة صحية متكاملة
        </div>
      </div>
    </header>

    <main class="grid flex-1 gap-6 lg:grid-cols-[1.2fr_0.8fr]">
      <section class="rounded-[28px] border border-slate-200 bg-white p-5 shadow-xl shadow-slate-200/80">
        <div class="mb-4 flex items-center justify-between">
          <h2 class="text-xl font-extrabold text-indigo-900">المخطط السني التفاعلي</h2>
          <span class="rounded-full bg-indigo-50 px-3 py-1 text-sm font-medium text-indigo-700">تحديث مباشر</span>
        </div>
        <div class="rounded-2xl border border-slate-100 bg-slate-50 p-3">
          <div id="chartPlaceholder" class="rounded-2xl border border-dashed border-slate-300 p-8 text-center text-sm text-slate-500">
            جاري تحميل بيانات المريض...
          </div>
        </div>
      </section>

      <section class="space-y-6">
        <div class="rounded-[28px] border border-slate-200 bg-white p-5 shadow-xl shadow-slate-200/80">
          <h2 class="mb-4 text-xl font-extrabold text-indigo-900">البروفايل الطبي</h2>
          <div id="profileCard" class="space-y-4">
            <div class="rounded-2xl bg-slate-50 p-4">
              <p class="text-sm text-slate-500">الاسم</p>
              <p id="patientName" class="mt-1 text-lg font-bold text-slate-800">—</p>
            </div>
            <div class="grid gap-4 sm:grid-cols-2">
              <div class="rounded-2xl bg-slate-50 p-4">
                <p class="text-sm text-slate-500">الهاتف</p>
                <p id="patientPhone" class="mt-1 font-semibold text-slate-800">—</p>
              </div>
              <div class="rounded-2xl bg-slate-50 p-4">
                <p class="text-sm text-slate-500">العمر</p>
                <p id="patientAge" class="mt-1 font-semibold text-slate-800">—</p>
              </div>
            </div>
            <div class="rounded-2xl bg-slate-50 p-4">
              <p class="text-sm text-slate-500">ملاحظات التاريخ الطبي</p>
              <p id="patientHistory" class="mt-2 text-sm leading-7 text-slate-700">—</p>
            </div>
          </div>
        </div>

        <div class="rounded-[28px] border border-slate-200 bg-white p-5 shadow-xl shadow-slate-200/80">
          <h2 class="mb-4 text-xl font-extrabold text-indigo-900">ملخص المواعيد</h2>
          <div class="overflow-x-auto">
            <table class="min-w-full border-collapse text-right">
              <thead>
                <tr class="border-b border-slate-200 bg-slate-50 text-sm text-slate-600">
                  <th class="px-3 py-2 font-semibold">التاريخ</th>
                  <th class="px-3 py-2 font-semibold">الحالة</th>
                </tr>
              </thead>
              <tbody id="appointmentsTableBody" class="divide-y divide-slate-100 text-sm text-slate-700">
                <tr>
                  <td colspan="2" class="px-3 py-4 text-center text-slate-500">لا توجد مواعيد حالياً.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <footer class="mt-6 flex justify-center">
      <p class="text-center text-xs font-mono tracking-wide text-indigo-500/90">
        تطوير وإدارة: المهندس فارس حلاوي © 2026
      </p>
    </footer>
  </div>

  <script>
    const clinicTitle = document.getElementById('clinicTitle');
    const doctorName = localStorage.getItem('doctor_name');
    if (clinicTitle) {
      clinicTitle.textContent = doctorName ? `عيادة ${doctorName}` : 'عيادتي الرقمية';
    }

    function getPatientIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    function calculateAge(birthDate) {
      if (!birthDate) return '—';
      const birth = new Date(birthDate);
      if (Number.isNaN(birth.getTime())) return '—';
      const today = new Date();
      let age = today.getFullYear() - birth.getFullYear();
      const monthDiff = today.getMonth() - birth.getMonth();
      if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
        age -= 1;
      }
      return `${age} سنة`;
    }

    async function loadPatientRecord() {
      const patientId = getPatientIdFromUrl();
      const chartPlaceholder = document.getElementById('chartPlaceholder');
      const patientName = document.getElementById('patientName');
      const patientPhone = document.getElementById('patientPhone');
      const patientAge = document.getElementById('patientAge');
      const patientHistory = document.getElementById('patientHistory');
      const appointmentsTableBody = document.getElementById('appointmentsTableBody');

      if (!patientId) {
        chartPlaceholder.innerHTML = '<div class="text-rose-600">لم يتم العثور على معرف المريض في الرابط.</div>';
        return;
      }

      try {
        const response = await fetch(`https://onrender.com/api/patients/${patientId}`);
        if (!response.ok) {
          throw new Error('تعذر جلب بيانات المريض');
        }

        const patient = await response.json();
        patientName.textContent = patient.full_name || '—';
        patientPhone.textContent = patient.phone || '—';
        patientAge.textContent = calculateAge(patient.birth_date);
        patientHistory.textContent = patient.medical_history || 'لا توجد ملاحظات طبية متاحة.';

        chartPlaceholder.innerHTML = `
          <div class="rounded-2xl bg-white p-4 shadow-sm">
            <h3 class="text-lg font-bold text-indigo-900">${patient.full_name || 'المريض'}</h3>
            <p class="mt-2 text-sm text-slate-600">المخطط السني هنا سيظهر لاحقًا مع تفاصيل العلاج والتشخيص.</p>
          </div>
        `;

        appointmentsTableBody.innerHTML = `
          <tr>
            <td colspan="2" class="px-3 py-4 text-center text-slate-500">لا توجد مواعيد مسجلة لهذا المريض حاليًا.</td>
          </tr>
        `;
      } catch (error) {
        console.error(error);
        chartPlaceholder.innerHTML = '<div class="text-rose-600">حدث خطأ أثناء تحميل الملف الطبي.</div>';
      }
    }

    window.addEventListener('DOMContentLoaded', loadPatientRecord);
  </script>
</body>
</html>
