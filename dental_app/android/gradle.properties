# -Duser.language=en -Duser.country=US أُضيفا 2026-08-31: إعدادات المنطقة
# (Regional Format) على هذا الجهاز تستخدم نظام أرقام عربي (١٢٣...)، فكانت
# أدوات البناء الداخلية (bundletool عند تجميع ملفات classes*.dex) تولّد
# أسماء ملفات بأرقام عربية بدل اللاتينية وتفشل بخطأ "Invalid dex file
# indices" -- هذا يجبر عملية Gradle نفسها فقط على استخدام أرقام/لغة
# إنجليزية داخلياً، بلا أي تغيير لإعدادات النظام أو باقي البرامج.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
org.gradle.java.home=C:\\Program Files\\Java\\jdk-19
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
