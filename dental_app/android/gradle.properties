# -Duser.language=en -Duser.country=US أُضيفا 2026-08-31: إعدادات المنطقة
# (Regional Format) على هذا الجهاز تستخدم نظام أرقام عربي (١٢٣...)، فكانت
# أدوات البناء الداخلية (bundletool عند تجميع ملفات classes*.dex) تولّد
# أسماء ملفات بأرقام عربية بدل اللاتينية وتفشل بخطأ "Invalid dex file
# indices" -- هذا يجبر عملية Gradle نفسها فقط على استخدام أرقام/لغة
# إنجليزية داخلياً، بلا أي تغيير لإعدادات النظام أو باقي البرامج.
# ضبط الذاكرة خُفِّض 2026-09-05 بعد انهيار حقيقي لعملية Gradle أثناء
# assembleRelease: سجل الانهيار (hs_err_pid13492.log) قال حرفياً
# "Native memory allocation (mmap) failed to map 335544320 bytes for G1
# virtual space" مع 551MB فقط شاغرة من أصل 12GB، وملف الترحيل (page file)
# لم يبق منه سوى 286MB. الطلب السابق (3G هيب + 1G ميتاسبيس + 256m كود كاش +
# 8 عمّال متوازيين) أكبر مما يستطيع هذا الجهاز حجزه فعلياً وقت البناء.
# القيم الجديدة مبنية على الاستهلاك المقاس في السجل نفسه: الميتاسبيس لم
# يتجاوز 280MB (فـ 512m سقف مريح)، والهيب المستخدم كان دون 1GB.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
# حدّ العمّال المتوازين: كان 8 (عدد الأنوية)، وكل عامل يحجز ذاكرته الخاصة.
# 3 توازن معقول بين سرعة البناء وعدم خنق الجهاز.
org.gradle.workers.max=3
# عفريت Kotlin عملية مستقلة بذاكرتها الخاصة -- بلا هذا السطر يأخذ افتراضاً
# سخياً يُضاف فوق ذاكرة Gradle نفسها.
kotlin.daemon.jvmargs=-Xmx1G
org.gradle.java.home=C:\\Program Files\\Java\\jdk-19
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
